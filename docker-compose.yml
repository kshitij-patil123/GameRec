# Full stack:  cp .env.example .env  (set passwords) && docker compose up --build
# Web: http://localhost:8080   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16
    env_file: .env
    ports: ["127.0.0.1:5432:5432"]     # bound to localhost only
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8000 }
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
